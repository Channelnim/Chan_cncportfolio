    <script>
      (function() {
        var isBenign = function(msg) {
          if (!msg) return true;
          var str = String(msg).toLowerCase();
          return str.indexOf('script error') !== -1 ||
                 str.indexOf('websocket') !== -1 ||
                 str.indexOf('failed to connect') !== -1 ||
                 str.indexOf('vite:ws') !== -1;
        };

        window.addEventListener('error', function(event) {
          var msg = event.message || (event.error && event.error.message) || '';
          if (!event.filename || isBenign(msg)) {
            if (event.preventDefault) event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var msg = (event.reason && (event.reason.message || event.reason.stack)) || String(event.reason || '');
          if (isBenign(msg)) {
            if (event.preventDefault) event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            return true;
          }
        }, true);

        var prevOnError = window.onerror;
        window.onerror = function(message, source, lineno, colno, error) {
          if (!source || isBenign(message)) {
            return true;
          }
          if (typeof prevOnError === 'function') {
            return prevOnError.apply(this, arguments);
          }
        };
      })();
    </script>
